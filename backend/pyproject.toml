[project]
name = "mathmentor-backend"
version = "0.1.0"
description = "MathMentor AI backend — Sindh Board HSC-I Mathematics tutor API"
readme = "../README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.156.8",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16",
    "sqlalchemy>=2.1,<3",
    "alembic>=1.20",
    "psycopg[binary]>=3.3",
    "sympy>=1.14",
    "google-genai>=3.0",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "pytest-asyncio>=1.2",
    "pytest-cov>=7.0",
    "httpx>=0.28",
    "ruff>=0.17",
    "mypy>=2.4",
]

[tool.uv]
package = false

# ---------------- Ruff ----------------
[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "S", "SIM", "RUF", "ASYNC"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is fine in tests

# ---------------- MyPy ----------------
[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_configs = true

# ---------------- Pytest ----------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "integration: tests that need a running PostgreSQL",
    "gemini: tests that call the real Gemini API (skipped by default)",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
