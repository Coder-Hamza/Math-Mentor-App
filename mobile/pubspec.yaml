name: mathmentor
description: "MathMentor AI - step-by-step maths tutor for Sindh Board HSC-I students."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  provider: ^6.1.5
  shared_preferences: ^2.5.6
  # flutter_markdown is discontinued; flutter_markdown_plus is its official drop-in replacement.
  flutter_markdown_plus: ^1.0.12
  loading_animation_widget: ^1.3.0
  # Poppins is bundled below instead of using google_fonts: google_fonts pulls in
  # objective_c, whose native build hook fails when the Flutter SDK path contains a space,
  # and bundling gives true font weights offline.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Poppins  # Google Fonts, SIL Open Font License (assets/fonts/OFL.txt)
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
